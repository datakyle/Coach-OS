<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F1F3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach OS">
<title>Coach OS</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
</head>
<body>

<header class="appbar">
  <span class="brand">Coach OS</span>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab on" role="tab" id="tb-plan" aria-controls="tab-plan" aria-selected="true" data-tab="plan">Practice Plan</button>
    <button class="tab" role="tab" id="tb-clip" aria-controls="tab-clip" aria-selected="false" data-tab="clip">Clipboard</button>
    <button class="tab" role="tab" id="tb-lib" aria-controls="tab-lib" aria-selected="false" data-tab="lib">Play Library</button>
  </nav>
</header>

<main>

<!-- ============ PRACTICE PLAN ============ -->
<section class="page" id="tab-plan" role="tabpanel" aria-labelledby="tb-plan">
  <div class="agendawrap">

    <div class="agenda" id="agenda">
      <div class="agendahead">
        <div class="ahrow">
          <div class="field grow">
            <label for="planDate">Date</label>
            <input type="date" id="planDate">
          </div>
          <div class="field">
            <label for="planStart">Starts</label>
            <input type="time" id="planStart" step="300">
          </div>
        </div>
        <div class="field">
          <label for="planFocus">Working on</label>
          <input type="text" id="planFocus" placeholder="What today is about" spellcheck="false">
        </div>
        <p class="window" id="planWindow"></p>
      </div>

      <div class="rows" id="planRows"></div>

      <div class="row" style="margin-top:12px">
        <button class="btn" id="btnAddItem">+ Add item</button>
        <button class="btn primary grow" id="btnSavePlan">Save practice</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn sm" id="btnNewPlan">New practice</button>
        <button class="btn sm" id="btnCopyPlan">Copy last practice</button>
        <button class="btn sm" id="btnPrint">Print</button>
      </div>
    </div>

    <aside class="history">
      <div class="panel">
        <h3>History</h3>
        <div id="histList"></div>
      </div>
      <div class="panel">
        <h3>Blocks</h3>
        <p class="note">Tap to drop a block into today.</p>
        <div class="row" id="blocks"></div>
      </div>
    </aside>

  </div>
</section>

<!-- ============ CLIPBOARD ============ -->
<section class="page" id="tab-clip" role="tabpanel" aria-labelledby="tb-clip" hidden>
  <div class="app">

    <div class="top">
      <input id="playname" type="text" value="" aria-label="Play name" spellcheck="false">
      <button class="btn primary" id="btnSave">Save</button>
      <button class="btn" id="btnNew">New</button>
    </div>

    <div class="courtcard">
      <svg class="court" id="court" viewBox="0 0 560 440" role="img" aria-label="Half basketball court for designing plays">
        <defs>
          <marker id="ah-move" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--move)"/></marker>
          <marker id="ah-ball" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ball)"/></marker>
          <marker id="ah-def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--def)"/></marker>
        </defs>
        <rect class="court-bg" x="30" y="40" width="500" height="360" rx="2"/>
        <rect class="court-line" x="30" y="40" width="500" height="360"/>
        <rect class="court-line" x="220" y="40" width="120" height="190"/>
        <circle class="court-line" cx="280" cy="230" r="60"/>
        <path class="court-line" d="M 89.7 40 A 197.5 197.5 0 1 0 470.3 40"/>
        <line class="court-line" x1="250" y1="80" x2="310" y2="80"/>
        <circle class="hoop" cx="280" cy="93" r="9"/>
        <circle class="rimflash" id="rimflash" cx="280" cy="93" r="26"/>
        <g id="layerGhost"></g>
        <g id="layerPath"></g>
        <g id="layerTok"></g>
        <circle class="ball" id="ballTok" cx="-99" cy="-99" r="8.5"/>
      </svg>
    </div>

    <div class="side">

      <div class="panel">
        <h3>Tool</h3>
        <div class="tools" id="tools">
          <button class="btn on" data-tool="arrange">Place</button>
          <button class="btn" data-tool="move">Cut</button>
          <button class="btn" data-tool="dribble">Drib</button>
          <button class="btn" data-tool="pass">Pass</button>
          <button class="btn" data-tool="screen">Screen</button>
          <button class="btn" data-tool="shot">Shot</button>
          <button class="btn" data-tool="ball">Ball</button>
          <button class="btn" data-tool="dmove">Def</button>
        </div>
        <p class="hint" id="hint"></p>
      </div>

      <div class="panel">
        <h3>Steps</h3>
        <div class="stepbar" id="stepbar"></div>
        <div class="chips" id="chips"></div>
        <label class="check"><input type="checkbox" id="showall"> Show every step at once</label>
      </div>

      <div class="panel">
        <h3>Run it</h3>
        <div class="row">
          <button class="btn primary grow" id="btnPlay">Play</button>
          <button class="btn" id="btnStepFwd">Step</button>
          <button class="btn" id="btnReset">Reset</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button class="btn sm" data-speed="1600">Slow</button>
          <button class="btn sm on" data-speed="1100">Normal</button>
          <button class="btn sm" data-speed="700">Fast</button>
        </div>
      </div>

      <div class="panel">
        <h3>Formations</h3>
        <div class="row" id="offsets">
          <button class="btn sm" data-off="122">1-2-2</button>
          <button class="btn sm" data-off="olr">Overload R</button>
          <button class="btn sm" data-off="oll">Overload L</button>
          <button class="btn sm" data-off="4out">4 Out</button>
          <button class="btn sm" data-off="5out">5 Out</button>
          <button class="btn sm" data-off="horns">Horns</button>
          <button class="btn sm" data-off="box">Box</button>
        </div>
        <div class="row" id="defsets" style="margin-top:8px">
          <button class="btn sm" data-def="23">2-3</button>
          <button class="btn sm" data-def="32">3-2</button>
          <button class="btn sm" data-def="131">1-3-1</button>
          <button class="btn sm" data-def="man">Man</button>
          <button class="btn sm" data-def="off">Hide D</button>
        </div>
        <p class="note">Formations reset the starting spots and clear the steps.</p>
      </div>

    </div>
  </div>
</section>

<!-- ============ PLAY LIBRARY ============ -->
<section class="page" id="tab-lib" role="tabpanel" aria-labelledby="tb-lib" hidden>
  <div class="libwrap">
    <div class="panel">
      <h3>Your plays</h3>
      <div id="lib"></div>
    </div>
    <div class="panel" id="teamPanel">
      <h3>Team</h3>
      <div id="teamBody"></div>
    </div>

    <div class="panel">
      <h3>Backup</h3>
      <p class="note" style="margin-top:0">Plays are stored in this browser. Copy them out now and then, or to move them to another device.</p>
      <div class="row">
        <button class="btn sm" id="btnExport">Copy all</button>
        <button class="btn sm" id="btnImport">Paste in</button>
      </div>
      <textarea id="io" spellcheck="false" placeholder="Copy all puts your whole library here. To restore it on another device, paste it here and hit Paste in."></textarea>
    </div>
  </div>
</section>

</main>

<div class="toast" id="toast"></div>

<script src="js/firebase-config.js"></script>
<script src="js/store.js"></script>
<script src="js/cloud.js"></script>
<script src="js/clipboard.js"></script>
<script src="js/practice.js"></script>
<script src="js/app.js"></script>
</body>
</html>
